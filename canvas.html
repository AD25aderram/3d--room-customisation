<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomly | Draw your room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="./src/styles/theme.css">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        /* Grid lines every 50px = 1 metre (strong) and every 25px = the snap step (faint). */
        canvas {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background-color: var(--paper);
            background-image:
                linear-gradient(rgba(27,36,40,.10) 1px, transparent 1px),
                linear-gradient(90deg, rgba(27,36,40,.10) 1px, transparent 1px),
                linear-gradient(rgba(27,36,40,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(27,36,40,.045) 1px, transparent 1px);
            background-size: 50px 50px, 50px 50px, 25px 25px, 25px 25px;
            cursor: crosshair;
        }
        .panel {
            position: fixed; top: 16px; left: 16px; z-index: 2; width: min(300px, calc(100% - 32px));
            padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-lg);
            background: rgba(248,247,244,.94); backdrop-filter: blur(10px); box-shadow: var(--shadow-1);
        }
        .panel .wordmark { display: inline-block; font-size: 1rem; margin-bottom: 10px; }
        .panel h1 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 800; }
        .panel p { margin: 0; color: var(--ink-soft); font-size: .95rem; }
        .panel .actions { display: flex; gap: 8px; margin-top: 14px; }
        .panel .scale-note { margin-top: 12px; font-size: .8rem; }

        .setup { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(236,234,229,.9); backdrop-filter: blur(4px); }
        .setup-card { width: min(420px, 90vw); padding: 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--paper); box-shadow: var(--shadow-2); }
        .setup-card h1 { margin: 0 0 8px; font-size: 1.9rem; font-weight: 800; }
        .setup-card p { margin: 0 0 22px; color: var(--ink-soft); }
        .setup-card label { display: grid; gap: 8px; margin-bottom: 14px; color: var(--ink-soft); font-weight: 600; font-size: .9rem; }
        .setup-card select { min-height: 48px; padding: 0 12px; border: 1px solid rgba(27,36,40,.25); border-radius: var(--r-md); background: #fff; color: var(--ink); font: 500 1rem var(--font-ui); }
        .setup-card .btn { width: 100%; margin-top: 8px; }
        #pillar-count-wrap[hidden] { display: none; }
    </style>
</head>
<body>
    <section class="setup" id="pillar-setup">
        <form class="setup-card" id="pillar-form">
            <h1>Any pillars in the room?</h1>
            <p>Pillars show up in 3D and furniture can't be placed through them, so you'll mark them after the outline.</p>
            <label for="has-pillars">Pillars inside the room
                <select id="has-pillars" name="hasPillars">
                    <option value="no">No pillars</option>
                    <option value="yes">Yes, there are pillars</option>
                </select>
            </label>
            <label id="pillar-count-wrap" for="pillar-count" hidden>How many pillars
                <select id="pillar-count" name="pillarCount">
                    <option value="1">1 pillar</option>
                    <option value="2">2 pillars</option>
                    <option value="3">3 pillars</option>
                    <option value="4">4 pillars</option>
                    <option value="5">5 pillars</option>
                </select>
            </label>
            <button class="btn" type="submit">Start drawing</button>
        </form>
    </section>

    <aside class="panel" aria-live="polite">
        <a class="wordmark" href="mainpage.html">Roomly</a>
        <h1 id="step-title">Room outline</h1>
        <p id="step-hint">Click to place the first corner.</p>
        <div class="actions">
            <button type="button" class="btn btn--quiet btn--small" id="undo-btn" disabled>Undo</button>
            <button type="button" class="btn btn--quiet btn--small" id="reset-btn" disabled>Start over</button>
        </div>
        <p class="scale-note">Each square is 1 metre. Corners snap to half a metre.</p>
    </aside>

    <canvas id="draw"></canvas>
    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js",
            "three/addons/": "./node_modules/three/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./src/canvas.js"></script>
</body>
</html>
