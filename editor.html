<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floorplot | Room editor</title>
    <meta name="description" content="Arrange furniture in your custom 3D room and check how everything fits.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="./src/styles/theme.css">
    <link rel="stylesheet" href="./src/styles/editor.css">
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-WFW3NT83"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
    </script>

    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
    <script type="module" src="./src/main.js"></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="wordmark" href="index.html" aria-label="Floorplot, back to start">Floorplot</a>
        <span class="meta" id="room-meta"></span>
        <button type="button" class="btn btn--quiet btn--small" id="undo-action" disabled>Undo</button>
        <button type="button" class="btn btn--quiet btn--small" id="reset-view">Reset view</button>
    </header>

    <div class="view-control">
        <button type="button" class="btn btn--quiet btn--small" id="view-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="view-menu">View</button>
        <div class="view-menu" id="view-menu" role="menu" aria-label="Camera view" hidden>
            <button type="button" role="menuitemradio" aria-checked="false" data-camera-view="room">Room view</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-camera-view="top">Top view</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-camera-view="eye">Eye level</button>
        </div>
    </div>

    <div id="scene-container"></div>

    <p class="hint" id="hint">Right-click or double-click a piece to move, rotate, resize or remove it. Drag to look around, scroll to zoom.</p>
</body>
</html>
