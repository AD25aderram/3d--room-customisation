<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>three js application</title>

    <script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}

<script type="module" src="./src/main.js"></script>
    <style>
        #scene-container { width: 100%; height: 100%; } 
        body{
            height:100%;
            margin: 0;
            overflow:hidden;

            text-align: center;
            font-size: 12px;
            font-family: sans-serif;

            color: #444;
        }

        h1{
            position: absolute;
            top: 14px;
            left: 0;
            width: 100%;
            margin: 0;

            font-size: 22px;
            font-weight: 600;
            color: #1d3557;

            z-index: 5;            /* above the canvas */
            pointer-events: none;  /* clicks pass through to the 3D scene */
        }
        #scene-container{
            position : absolute;
            width: 100%;
            height:100%;
            background-color: skyblue;
        }

        
    </style>
</head>

    <h1>3D Room Customizer, see it before you buy it!</h1>    <div id="scene-container">
