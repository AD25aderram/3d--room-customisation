    <title>Roomly | See the room before you buy the furniture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="./src/styles/theme.css">
    <style>
        .home {
            width: min(1180px, 92vw);
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(1.5rem, 4vw, 3rem) 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
            gap: clamp(2rem, 5vw, 5rem);
            align-items: center;
        }
        .intro .wordmark { display: inline-block; margin-bottom: clamp(2rem, 8vh, 5rem); }
        h1 { margin: 0 0 1.25rem; font-size: clamp(2.6rem, 6vw, 4.8rem); font-weight: 800; letter-spacing: -0.045em; }
        .lede { max-width: 30rem; margin: 0 0 2.25rem; color: var(--ink-soft); font-size: 1.15rem; }
        .start { display: grid; gap: 12px; max-width: 30rem; }
        .start-card {
            display: grid; grid-template-columns: 52px 1fr; gap: 16px; align-items: center;
            padding: 16px 18px; color: var(--ink); text-decoration: none;
            border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--paper);
            transition: border-color .15s, transform .15s, box-shadow .15s;
        }
        .start-card:hover { border-color: var(--pine); transform: translateY(-2px); box-shadow: var(--shadow-1); }
        .start-card--primary { background: var(--pine); border-color: var(--pine); color: #fff; }
        .start-card--primary:hover { background: var(--pine-deep); }
        .start-icon {
            display: grid; place-items: center; width: 52px; height: 52px;
            border-radius: 14px; background: var(--plaster); color: var(--pine);
        }
        .start-card--primary .start-icon { background: rgba(255,255,255,.14); color: #fff; }
        .start-title { display: block; font: 700 1.15rem var(--font-display); letter-spacing: -0.02em; }
        .start-sub { display: block; margin-top: 2px; font-size: .95rem; color: var(--ink-soft); }
        .start-card--primary .start-sub { color: rgba(255,255,255,.82); }

        .hero-art { border-radius: 32px; background: var(--plaster-deep); padding: clamp(.5rem, 2vw, 1.5rem); }
        .hero-art svg { display: block; width: 100%; height: auto; }
        .hero-art .piece { animation: place .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.35s + var(--i) * .16s); }
        @keyframes place { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }

        @media (max-width: 860px) {
            .home { grid-template-columns: 1fr; min-height: 0; }
            .intro .wordmark { margin-bottom: 2rem; }
        }
    </style>
</head>

            <h1>See the room before you buy the furniture.</h1>
