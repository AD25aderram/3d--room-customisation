<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomly | Choose a preset</title>
    <style>
        :root { --ink:#f7f4ef; --muted:#a9a39d; --accent:#ffb86b; --panel:#252229; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); font-family:Inter,system-ui,sans-serif; background:linear-gradient(140deg,#17151a,#3a2a2d); }
        .card { width:min(680px,92vw); padding:clamp(1.5rem,5vw,3.5rem); border:1px solid rgba(255,255,255,.13); border-radius:28px; background:rgba(31,29,34,.86); box-shadow:0 24px 80px rgba(0,0,0,.25); }
        .back { color:var(--muted); text-decoration:none; } .back:hover { color:var(--accent); }
        h1 { margin:2.5rem 0 .6rem; font-size:clamp(2.2rem,6vw,4rem); letter-spacing:-.06em; }
        .subtitle { margin:0 0 2rem; color:var(--muted); line-height:1.5; }
        form { display:grid; gap:1.3rem; }
        .field-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
        label { display:grid; gap:.55rem; color:var(--muted); font-size:.9rem; font-weight:600; }
        select, input { width:100%; padding:1rem; color:var(--ink); border:1px solid #514951; border-radius:12px; background:var(--panel); font:inherit; }
        [hidden] { display:none !important; }
        select:focus, input:focus { border-color:var(--accent); outline:2px solid rgba(255,184,107,.2); }
        button { margin-top:.8rem; padding:1rem 1.2rem; color:#271d19; border:0; border-radius:12px; background:var(--accent); font:700 1rem inherit; cursor:pointer; }
        button:hover { background:#ffc98f; } @media(max-width:520px){.field-row{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <main class="card">
        <a class="back" href="mainpage.html">← Back</a>
        <h1>Start with a shape.</h1>
        <p class="subtitle">Choose a foundation for your room. You can refine the space as you arrange it.</p>
        <form id="preset-form" action="index.html">
            <label>Room shape
                <select name="shape" id="shape">
                    <option value="rectangle">Rectangle</option>
                    <option value="square">Square</option>
                    <option value="cylinder">Cylinder</option>
                </select>
            </label>
            <div class="field-row" id="rectangular-dimensions">
                <label>Width <input type="number" name="width" value="10" min="1" step="0.5"> </label>
                <label id="depth-field">Length <input type="number" name="depth" value="10" min="1" step="0.5"> </label>
            </div>
            <div id="square-dimensions" hidden>
                <label>Length <input type="number" name="length" value="10" min="1" step="0.5" disabled> </label>
            </div>
            <div id="cylinder-dimensions" hidden>
                <label>Radius <input type="number" name="radius" value="5" min="1" step="0.5" disabled> </label>
            </div>
            <button type="submit">Open room editor <span aria-hidden="true">→</span></button>
        </form>
    </main>
    <script>
        const presetForm = document.getElementById("preset-form");
        const shapeSelect = document.getElementById("shape");
        const rectangularDimensions = document.getElementById("rectangular-dimensions");
        const squareDimensions = document.getElementById("square-dimensions");
        const cylinderDimensions = document.getElementById("cylinder-dimensions");
        const rectangularInputs = rectangularDimensions.querySelectorAll("input");
        const squareInput = squareDimensions.querySelector("input");
        const cylinderInput = cylinderDimensions.querySelector("input");

        function updateDimensions() {
            const shape = shapeSelect.value;
            const isSquare = shape === "square";
            const isCylinder = shape === "cylinder";
            const showRectangular = !isSquare && !isCylinder;

            rectangularDimensions.hidden = !showRectangular;
            squareDimensions.hidden = !isSquare;
            cylinderDimensions.hidden = !isCylinder;
            rectangularInputs.forEach((input) => {
                input.disabled = !showRectangular;
                input.required = showRectangular;
            });
            squareInput.disabled = !isSquare;
            squareInput.required = isSquare;
            cylinderInput.disabled = !isCylinder;
            cylinderInput.required = isCylinder;
        }

        shapeSelect.addEventListener("change", updateDimensions);
        updateDimensions();

        presetForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const formData = new FormData(presetForm);
            sessionStorage.setItem("presetRoom", JSON.stringify(Object.fromEntries(formData)));
            window.location.href = presetForm.action;
        });
    </script>
</body>
</html>
